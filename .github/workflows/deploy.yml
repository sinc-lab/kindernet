name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

# main and dev both push to gh-pages; run deploys one at a time
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      # Stable: main -> gh-pages root (keeps the dev/ folder)
      - name: Deploy stable
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
          clean-exclude: dev
          token: ${{ secrets.GITHUB_TOKEN }}
      # Dev: dev -> gh-pages/dev/
      - name: Deploy dev
        if: github.ref == 'refs/heads/dev'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
          target-folder: dev
          token: ${{ secrets.GITHUB_TOKEN }}
